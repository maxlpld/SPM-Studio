name: Test suite
# Reusable: called by tests.yml (every push / pull request) and release.yml (before publishing).
on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      python-version:
        type: string
        required: true
      ref:
        description: 'Git ref to test (empty = the commit that triggered the run)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: ${{ inputs.os }} · Python ${{ inputs.python-version }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60              # the Windows runners need up to ~40 min for the full suite
    env:
      QT_QPA_PLATFORM: offscreen
      SPM_STUDIO_USE_GH_CLI: '0'       # tests never use a GitHub sign-in
      PYTHONUTF8: '1'                 # Python text files default to UTF-8 on Windows, too
      PYTHONIOENCODING: 'utf-8'       # spawned module-runner output includes scientific symbols
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libfontconfig1 libdbus-1-3 xvfb xauth \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xkb1 libx11-xcb1 libxcb-util1 libxcb-shape0 libxcb-xfixes0
      - name: Install source and test tools
        run: python -m pip install -e ".[all,dev]"
      - name: Check Qt XCB shared-library dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          plugin="$(python -c "import PySide6; from pathlib import Path; print(Path(PySide6.__file__).parent / 'Qt/plugins/platforms/libqxcb.so')")"
          echo "Checking Qt plugin: $plugin"
          ldd "$plugin" | tee /tmp/spm-xcb-ldd.txt
          if grep -q 'not found' /tmp/spm-xcb-ldd.txt; then
            echo "::error::Qt xcb plugin has missing native libraries"
            exit 1
          fi
      - name: Python syntax
        run: python -m compileall -q src scripts tools install.py
      - name: Installer dry run (this OS)
        run: python install.py ${{ runner.os == 'Windows' && '-Mode DryRun' || '--dry-run' }}
      - name: Shell script syntax
        if: runner.os != 'Windows'
        shell: bash
        run: for f in *.sh *.command; do bash -n "$f" || exit 1; done
      - name: PowerShell script syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Filter *.ps1) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { Write-Host "$($f.Name):"; $errs | ForEach-Object { Write-Host "  $_" }; $bad = 1 }
          }
          exit $bad
      # On Linux, run Qt against a virtual X11 display; offscreen can crash in native Qt.
      - name: GUI smoke test (Linux/Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a env QT_QPA_PLATFORM=xcb QT_OPENGL=software LIBGL_ALWAYS_SOFTWARE=1 python -X faulthandler -m spm_studio --smoke-test
      - name: GUI smoke test (Windows/macOS)
        if: runner.os != 'Linux'
        run: python -X faulthandler -m spm_studio --smoke-test
      # Reproduce Windows' traditional cp1252 default used by Anaconda and
      # non-UTF-8 machines. This caught the v0.0.5 assistant-context failure.
      - name: Windows GUI smoke with UTF-8 mode disabled
        if: runner.os == 'Windows'
        env:
          PYTHONUTF8: '0'
        run: python -X utf8=0 -X faulthandler -m spm_studio --smoke-test
      - name: Test suite (Linux/Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a env QT_QPA_PLATFORM=xcb QT_OPENGL=software LIBGL_ALWAYS_SOFTWARE=1 python -X faulthandler -m pytest -vv -rs
      - name: Test suite (Windows/macOS)
        if: runner.os != 'Linux'
        run: python -X faulthandler -m pytest -vv -rs
