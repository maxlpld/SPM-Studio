name: UI screenshots
# Design review: renders the main windows and dialogs offscreen (tools/ui_screenshots.py) and keeps the
# pictures as a downloadable artifact. Runs on demand and on pushes to ui-preview/* branches.
on:
  workflow_dispatch:
  push:
    branches: ['ui-preview/**']

permissions:
  contents: read

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install -e ".[all]"
      - name: Screenshots
        timeout-minutes: 10
        run: python tools/ui_screenshots.py ui-screenshots --size 1440x900
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ui-screenshots/
          retention-days: 7
